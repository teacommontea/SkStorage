name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch build dependencies
        shell: pwsh
        run: ./tools/fetch-deps.ps1

      - name: Build
        shell: pwsh
        run: ./tools/build.ps1 -NoBump

      - name: Locate jar
        id: jar
        shell: pwsh
        run: |
          $jar = Get-ChildItem SkStorage-*.jar | Select-Object -First 1
          "path=$($jar.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($jar.Name)"     >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.path }}

      - name: Attach jar to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
